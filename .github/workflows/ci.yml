name: CI

on:
  push:
    branches: [master, main, "modernize/**"]
  pull_request:

jobs:
  static:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ssh2, mbstring
          coverage: none
          tools: composer:v2, cs2pr
      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: PHP-CS-Fixer
        run: composer cs -- --format=checkstyle | cs2pr
      - name: PHPStan
        run: composer stan -- --error-format=github

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ssh2, mbstring
          coverage: xdebug
      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: PHPUnit
        env:
          XDEBUG_MODE: coverage
        run: vendor/bin/phpunit --coverage-clover=build/coverage/clover.xml
      - name: Enforce 100% line coverage
        if: matrix.php == '8.2'
        run: php tests/bin/check-coverage.php build/coverage/clover.xml 100

  functional:
    name: Functional tests (Behat, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ssh2, mbstring
          coverage: none
      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: Start SFTP fixture
        run: docker compose -f tests/functional/docker-compose.yml up -d --wait
      - name: Behat
        run: vendor/bin/behat --no-colors --format=pretty
      - name: Stop SFTP fixture
        if: always()
        run: docker compose -f tests/functional/docker-compose.yml down -v
