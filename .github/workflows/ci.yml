name: CI

on:
  push:
    branches: [master, main, "modernize/**", "modernized"]
  pull_request:

jobs:
  static:
    name: Static analysis & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ssh2, mbstring
          coverage: none
          tools: composer:v2, cs2pr
      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: Composer audit (fails on advisories)
        run: composer audit --no-dev --locked
      - name: PHP-CS-Fixer
        run: composer cs -- --format=checkstyle | cs2pr
      - name: PHPStan
        run: composer stan -- --error-format=github

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ssh2, mbstring, xdebug
          coverage: xdebug
      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist
      # Fail-fast on the floor build if xdebug didn't actually load —
      # setup-php's `coverage: xdebug` install is occasionally flaky on a
      # given PHP-minor + xdebug-version pairing, and a missing driver
      # makes PHPUnit silently skip the coverage report (the "no coverage
      # driver" runner warning isn't caught by phpunit.xml's failOnWarning,
      # which only fires on test-level warnings). Without this gate, the
      # symptom surfaces three steps later as "clover.xml not found",
      # which is far from the actual cause.
      - name: Verify xdebug is loaded
        if: matrix.php == '8.2'
        run: |
          if ! php -r 'exit(extension_loaded("xdebug") ? 0 : 1);'; then
            echo "::error::xdebug is not loaded — setup-php install must have skipped it."
            php -m
            exit 1
          fi
      - name: PHPUnit
        env:
          XDEBUG_MODE: coverage
        # Absolute --coverage-clover path is intentional. The test
        # bootstrap (tests/bootstrap.php) chdirs into scratch/ to shield
        # the repo root from stray writes by Infection mutants, so a
        # relative coverage path here would resolve against scratch/
        # and land at scratch/build/coverage/clover.xml — invisible to
        # the gate and Codecov steps that look at the repo-root path.
        run: |
          mkdir -p build/coverage
          vendor/bin/phpunit --coverage-clover="${GITHUB_WORKSPACE}/build/coverage/clover.xml"
          if [ "${{ matrix.php }}" = "8.2" ] && [ ! -s build/coverage/clover.xml ]; then
            echo "::error::PHPUnit completed but did not produce build/coverage/clover.xml (driver missing, or writer failed)."
            exit 1
          fi
      - name: Enforce 100% line coverage
        if: matrix.php == '8.2'
        run: php tests/bin/check-coverage.php build/coverage/clover.xml 100
      # Upload to Codecov on the floor-PHP build only — multi-version
      # uploads would just produce duplicate reports against the same
      # commit. `if: always()` so a failing local gate (line-coverage
      # check above) still surfaces the report; Codecov UI is more
      # useful than re-running locally to find which 1% slipped.
      # CODECOV_TOKEN is optional for public repos but recommended:
      # without it Codecov's rate limiting kicks in on busy days.
      - name: Upload coverage to Codecov
        if: always() && matrix.php == '8.2'
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage/clover.xml
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  mutation:
    name: Mutation testing (Infection)
    runs-on: ubuntu-latest
    needs: unit
    # Single PHP version — Infection is expensive and the unit-suite
    # already runs across 8.2/8.3/8.4, so mutation analysis pinned to the
    # floor catches "the test still passes but the mutant survived" cases
    # without paying the cost three times.
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ssh2, mbstring
          coverage: xdebug
      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: Infection
        env:
          XDEBUG_MODE: coverage
        # min-msi / min-covered-msi gates live in infection.json5 (both
        # 85, calibrated against the actual baseline — see the JSON5
        # comment for the rationale).
        run: vendor/bin/infection --threads=4 --no-progress --no-interaction --logger-github

  functional:
    name: Functional tests (Behat, PHP ${{ matrix.php }}, server ${{ matrix.server.name }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        # Multi-server matrix: atmoz/sftp (chroot, alpine, libssh2-flavour)
        # and OpenSSH 9.x (full OpenSSH daemon). Both fixtures are brought
        # up in the same docker-compose call; the SFTP_PORT env var
        # parameterises the Behat suite.
        # `behat_tags` opts the atmoz job out of @needs-shell scenarios
        # (SCP, ShellSumRemoteHasher — both require the `scp` / shell
        # access that atmoz/sftp's chrooted internal-sftp doesn't
        # provide). The openssh job runs everything.
        server:
          - { name: atmoz,   port: 2222, behat_tags: "~@needs-shell" }
          - { name: openssh, port: 2223, behat_tags: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ssh2, mbstring
          coverage: none
      - name: Composer install
        run: composer install --no-progress --no-interaction --prefer-dist
      - name: Generate fixture SSH keypair
        run: |
          mkdir -p tests/functional/fixtures/keys
          ssh-keygen -t rsa -b 2048 -N "" -f tests/functional/fixtures/keys/id_rsa -C "idct-sftp-ci"
      - name: Start SFTP + minio fixtures
        run: docker compose -f tests/functional/docker-compose.yml up -d --wait
      - name: Behat (${{ matrix.server.name }})
        env:
          SFTP_PORT: ${{ matrix.server.port }}
        run: |
          if [ -n "${{ matrix.server.behat_tags }}" ]; then
            vendor/bin/behat --no-colors --format=pretty --tags="${{ matrix.server.behat_tags }}"
          else
            vendor/bin/behat --no-colors --format=pretty
          fi
      - name: Stop SFTP fixtures
        if: always()
        run: docker compose -f tests/functional/docker-compose.yml down -v
